<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>OneVoice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='M10 13v6M14 9v14M18 11v10M22 14v4' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 10v4M10 6v12M14 8v8M18 11v2"/></svg>
        </span>
        <span class="brand-name">OneVoice</span>
      </div>
      <div class="topbar-right">
        <span class="engine-pill" id="enginePill" title="Trạng thái engine">
          <span class="dot"></span><span id="engineName">Đang kết nối…</span>
        </span>
        <button class="icon-btn" id="autoplayBtn" aria-pressed="true" title="Tự động phát bản dịch">
          <svg viewBox="0 0 24 24" class="i-on"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <svg viewBox="0 0 24 24" class="i-off"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="Đổi giao diện sáng/tối">
          <svg viewBox="0 0 24 24" class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg viewBox="0 0 24 24" class="i-moon"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <section class="langbar" aria-label="Chọn ngôn ngữ">
      <label class="lang">
        <span class="lang-label">Nói</span>
        <select id="srcLang" aria-label="Ngôn ngữ nguồn"></select>
      </label>
      <button class="swap" id="swapBtn" title="Đảo chiều dịch" aria-label="Đảo chiều dịch">
        <svg viewBox="0 0 24 24"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg>
      </button>
      <label class="lang lang-right">
        <span class="lang-label">Dịch sang</span>
        <select id="tgtLang" aria-label="Ngôn ngữ đích"></select>
      </label>
    </section>

    <main class="feed" id="feed" aria-live="polite">
      <div class="empty" id="empty">
        <div class="empty-orb" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </div>
        <h1>Nói để dịch</h1>
        <p>Nhấn nút micro rồi bắt đầu nói. Nhấn lần nữa để dịch.</p>
        <p class="hint"><kbd>Space</kbd> giữ để nói &nbsp;·&nbsp; <kbd>Esc</kbd> huỷ</p>
      </div>
    </main>

    <footer class="dock">
      <ol class="stages" id="stages" aria-label="Tiến trình">
        <li data-stage="asr"><span class="st-ic"></span><span class="st-name">Nhận dạng</span><span class="st-ms"></span></li>
        <li data-stage="mt"><span class="st-ic"></span><span class="st-name">Dịch</span><span class="st-ms"></span></li>
        <li data-stage="tts"><span class="st-ic"></span><span class="st-name">Đọc</span><span class="st-ms"></span></li>
      </ol>

      <div class="controls">
        <button class="side-btn" id="uploadBtn" title="Tải lên file âm thanh" aria-label="Tải lên file âm thanh">
          <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        </button>
        <input type="file" id="fileInput" accept="audio/*" hidden>

        <div class="mic-wrap">
          <canvas class="wave" id="wave" aria-hidden="true"></canvas>
          <button class="mic" id="micBtn" aria-label="Bắt đầu ghi âm">
            <span class="mic-halo" id="micHalo"></span>
            <svg viewBox="0 0 24 24" class="i-mic"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            <span class="i-stop"></span>
            <span class="i-spin"></span>
          </button>
        </div>

        <button class="side-btn" id="clearBtn" title="Xoá hội thoại" aria-label="Xoá hội thoại">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        </button>
      </div>

      <div class="status" id="status">Sẵn sàng</div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <template id="turnTpl">
    <article class="turn">
      <div class="turn-meta">
        <span class="chip"><b class="m-src"></b><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg><b class="m-tgt"></b></span>
        <span class="m-time"></span>
        <span class="m-lat"></span>
      </div>
      <p class="src-text"><span class="skel"></span></p>
      <button class="play play-in" aria-label="Nghe lại âm thanh gốc">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
        <span class="pl-label">Gốc</span>
        <span class="bar"><span class="bar-fill"></span></span>
        <span class="dur">--:--</span>
      </button>
      <p class="tgt-text"><span class="skel"></span><span class="skel short"></span></p>
      <div class="turn-actions">
        <button class="play play-out" disabled aria-label="Phát bản dịch">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5h3v14H8zM13 5h3v14h-3z"/></svg>
          <span class="bar"><span class="bar-fill"></span></span>
          <span class="dur">--:--</span>
        </button>
        <button class="ghost a-edit" title="Sửa chữ nhận dạng rồi dịch lại" aria-label="Sửa chữ nhận dạng rồi dịch lại" disabled>
          <svg viewBox="0 0 24 24" class="i-edit"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M14 6l4 4"/></svg>
          <svg viewBox="0 0 24 24" class="i-ok"><path d="M5 12l5 5 9-10"/></svg>
        </button>
        <button class="ghost a-copy" title="Sao chép bản dịch" aria-label="Sao chép bản dịch" disabled>
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>
        </button>
      </div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
